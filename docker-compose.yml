x-airflow-common: &airflow-common
  build: .
  image: ${GAZETTE_IMAGE:-la-gazette:local}
  restart: "no"
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
    AIRFLOW__CORE__PARALLELISM: '2'
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: '1'
    AIRFLOW__SCHEDULER__PARSING_PROCESSES: '1'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'True'
    AIRFLOW__WEBSERVER__WORKERS: '2'
    AIRFLOW__WEBSERVER__SECRET_KEY: 'cle_secrete_super_securisee_gazette'
    GAZETTE_DB_URL: postgresql://gazette:gazette@postgres:5432/gazette
    GAZETTE_TEST_DB_URL: postgresql://gazette:gazette@postgres:5432/gazette_test
    MINIO_ENDPOINT: minio:9000
    MINIO_ACCESS_KEY: minioadmin
    MINIO_SECRET_KEY: minioadmin
    BRONZE_BUCKET: bronze
    SOURCES_CSV: /opt/airflow/sources.csv
    HF_HOME: /opt/airflow/.cache/huggingface
    TOKENIZERS_PARALLELISM: 'false'
    NUMBA_NUM_THREADS: '4'
    OMP_NUM_THREADS: '4'
    TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
    GAZETTE_ENV: ${GAZETTE_ENV:-local}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-airflow}
  volumes:
    - ./src:/opt/airflow/dags/src
    - ./tests:/opt/airflow/tests
    - ./docs/sources.csv:/opt/airflow/sources.csv:ro
    - ./data/import:/opt/airflow/import:ro
    - ./config:/opt/airflow/dags/config:ro
    - model-cache:/opt/airflow/.cache/huggingface
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15-alpine
    restart: "no"
    logging: *logging
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Sans volume, la base (et la table sources) serait effacée à chaque down
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    restart: "no"
    logging: *logging
    command: minio server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ./data/bronze:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:11.2.0
    restart: "no"
    logging: *logging
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Source de données PostgreSQL et tableau de bord « Qualité » provisionnés
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      postgres:
        condition: service_healthy

  airflow-init:
    <<: *airflow-common
    command: >
      bash -ec "airflow db migrate &&
      (cd /opt/airflow/dags && python -m src.stockage.migrer) &&
      (airflow users list --output json | python -c 'import json,sys; sys.exit(not any(u[\"username\"] == \"airflow\" for u in json.load(sys.stdin)))' ||
      airflow users create --role Admin --username airflow --password \"$${AIRFLOW_ADMIN_PASSWORD}\" --email admin@example.com --firstname Admin --lastname Admin)"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8974/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  model-cache:
  airflow-logs:
